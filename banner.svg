<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-labelledby="title desc">
  <title id="title">Christen George-McFerrin</title>
  <desc id="desc">AI automation builder for GTM teams. Founder of demand AI studio.</desc>

  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7E55E8"/>
      <stop offset="1" stop-color="#00B595"/>
    </linearGradient>
    <radialGradient id="violetWash" cx="8%" cy="5%" r="62%">
      <stop offset="0" stop-color="#7E55E8" stop-opacity="0.22"/>
      <stop offset="0.7" stop-color="#7E55E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealWash" cx="94%" cy="100%" r="58%">
      <stop offset="0" stop-color="#00B595" stop-opacity="0.18"/>
      <stop offset="0.72" stop-color="#00B595" stop-opacity="0"/>
    </radialGradient>
    <filter id="halo" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#7E55E8" flood-opacity="0.40"/>
      <feDropShadow dx="0" dy="0" stdDeviation="11" flood-color="#00B595" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="900" height="240" rx="18" fill="#FAF7F2"/>
  <rect width="900" height="240" rx="18" fill="url(#violetWash)"/>
  <rect width="900" height="240" rx="18" fill="url(#tealWash)"/>
  <rect x="1" y="1" width="898" height="238" rx="17" fill="none" stroke="url(#aurora)" stroke-opacity="0.42"/>

  <g transform="translate(64 82) scale(2.35)" filter="url(#halo)">
    <path d="M18 2 6 18h8l-1 12 13-16h-8z" fill="url(#aurora)"/>
  </g>

  <text x="146" y="91" fill="#1B1A1F" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" letter-spacing="-0.5">Christen George-McFerrin</text>
  <text x="148" y="132" fill="url(#aurora)" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="1.5">AI AUTOMATION BUILDER FOR GTM TEAMS</text>
  <text x="148" y="169" fill="#54515E" font-family="Arial, Helvetica, sans-serif" font-size="18">Working systems. Human approval. Clear handoffs.</text>
  <text x="148" y="201" fill="#54515E" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="1.1">FOUNDER · DEMAND AI STUDIO</text>
</svg>
